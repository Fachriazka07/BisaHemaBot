<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BisaHemat Bot API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 400px;
    }
    h1 { margin-top: 0; font-size: 1.8rem; }
    p { color: #94a3b8; }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #022c22;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-weight: bold;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🤖 BisaHemat Bot</h1>
    <div class="badge">ONLINE 24/7</div>
    <p>Telegram Finance Tracking Bot is running on Vercel Serverless.</p>
  </div>
</body>
</html>
